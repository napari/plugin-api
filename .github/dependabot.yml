# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(dependabot):"
    # Only propose a release once it is a week old, so a compromised or
    # broken release has time to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(dependabot):"
    # Only propose a release once it is a week old, so a compromised or
    # broken release has time to be noticed and pulled.
    cooldown:
      default-days: 7
