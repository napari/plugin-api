name: Update Plugin Index

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # "every 2 hours"
    - cron: 0 */2 * * *

# Two runs must never commit to napari/plugin-api-data at the same time.
concurrency:
  group: update-plugin-index-${{ github.event_name == 'pull_request' && github.ref || 'data' }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The generated JSON lives in napari/plugin-api-data. Check it out into
      # public/, where every script reads and writes it. DATA_DEPLOY_KEY is a
      # deploy key with write access to that repository only; without it (on
      # pull requests from forks) the checkout is read-only, which is all a
      # pull request needs.
      - name: Check out napari/plugin-api-data into public/
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: napari/plugin-api-data
          path: public
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      # reindex requires conda to be setup
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-activate-base: true
          activate-environment: ""

      - name: Find packages by classifier
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python scripts/bigquery.py

      # fetch new manifests for new/updated plugins, based on active versions found with bigquery
      - name: Fetch manifests
        run: |
          python scripts/fetch_manifests.py

      # validate and re-index plugin versions in case new ones have been
      # retrieved from bigquery
      # will update extended_summary.json, index.json and pypi.json
      # to include all plugin versions
      - name: (re)index
        run: |
          python scripts/reindex.py
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CODECOV_API_TOKEN: ${{ secrets.CODECOV_API_TOKEN }}

      # Invalid data is never committed or deployed.
      - name: Validate the data
        run: |
          python -m pytest tests/test_output.py -q

      # Commit the new data to napari/plugin-api-data. Skip on PRs: they only
      # validate.
      # https://github.com/stefanzweifel/git-auto-commit-action
      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        if: github.event_name != 'pull_request'
        with:
          repository: public
          commit_message: '[bot] Update Plugin Index'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      - name: Prepare gh-pages
        run: |
          python scripts/build_site.py --out gh-pages

      # upload gh-pages artifact for PRs (for inspection)
      - name: Upload gh-pages artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-pages-preview
          path: ./gh-pages

      # deploy to gh-pages branch (only on main/scheduled runs, not PRs)
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'napari-bot'
          user_email: 'napari-bot@users.noreply.github.com'
