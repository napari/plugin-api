name: Update Plugin Index

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # "every 2 hours"
    - cron: 0 */2 * * *

jobs:
  fetch:
    name: Fetch
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      # reindex requires conda to be setup
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          auto-activate-base: true
          activate-environment: ""

      - name: Find packages by classifier
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python scripts/bigquery.py

      # fetch new manifests for new/updated plugins, based on active versions found with bigquery
      - name: Fetch manifests
        run: |
          python scripts/fetch_manifests.py

      # validate and re-index plugin versions in case new ones have been
      # retrieved from bigquery
      # will update extended_summary.json, index.json and pypi.json
      # to include all plugin versions
      - name: (re)index
        run: |
          python scripts/reindex.py
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CODECOV_API_TOKEN: ${{ secrets.CODECOV_API_TOKEN }}

      # push changes back to the repo, this will trigger a new vercel build
      # https://github.com/stefanzweifel/git-auto-commit-action
      # skip on PRs - we only want to validate, not modify the PR
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        if: github.event_name != 'pull_request'
        with:
          commit_message: '[bot] Update Plugin Index'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      # prepare static files for gh-pages deployment
      # do this AFTER the vercel commit to make sure we're not messing with anything
      - name: Prepare gh-pages
        run: |
          python scripts/prepare_gh_pages.py

      # upload gh-pages artifact for PRs (for inspection)
      - name: Upload gh-pages artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-pages-preview
          path: ./gh-pages

      # deploy to gh-pages branch (only on main/scheduled runs, not PRs)
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'napari-bot'
          user_email: 'napari-bot@users.noreply.github.com'
